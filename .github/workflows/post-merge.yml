name: Post-merge runtime probing

# The article's post-merge tier: gates that probe the running system rather than the
# diff. The OWASP ZAP baseline scan boots the Compose stack (fresh Postgres, migrations
# applied) and probes the deployed HTTP surface for passive vulnerabilities and
# misconfigurations. It runs after merge to main — deliberately not on PRs — because
# its findings are about the assembled runtime, not about a particular change.
on:
  push:
    branches: [main]
    paths-ignore:
      - "openspec/**"
      - "src/public-site/**"
      - ".github/workflows/public-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  # The ZAP action files its report as an issue on WARN/FAIL; without this grant it
  # 403s ("Resource not accessible by integration") after a successful scan.
  issues: write

jobs:
  zap-baseline:
    name: ZAP baseline scan of the Compose stack
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Build container image
        run: docker build -f deploy/docker/Dockerfile -t raccord:ci .
      - name: Boot the Compose stack
        working-directory: deploy
        run: |
          # CI-only values; nothing here touches any real environment.
          POSTGRES_PASSWORD=ci-only RACCORD_IMAGE=raccord:ci RACCORD_SEED_DEMO_DATA=true docker compose up --detach --wait
      - name: ZAP baseline scan (blocking on FAIL)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080"
          # Passive baseline scan: no attack traffic, findings surface as WARN by
          # default; the job fails only on a FAILED scan. Rules to escalate live in
          # the zap-rules file once a first baseline is recorded.
          cmd_options: "-a -I"
      - name: Tear down the Compose stack
        if: always()
        working-directory: deploy
        # Same CI-only value as the boot step: compose interpolates the connection
        # string even when only tearing down, so the variable must be set here too.
        env:
          POSTGRES_PASSWORD: ci-only
          RACCORD_IMAGE: raccord:ci
        run: docker compose down --volumes
