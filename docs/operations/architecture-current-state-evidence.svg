<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Current Raccord architecture boundary</title>
  <desc id="desc">The public sign-in and health endpoints surround an authenticated API and protected frontend shell.</desc>
  <rect width="960" height="430" rx="24" fill="#f7f5ef"/>
  <text x="48" y="58" fill="#17211b" font-family="system-ui, sans-serif" font-size="29" font-weight="700">Current architecture boundary</text>
  <text x="48" y="91" fill="#526057" font-family="system-ui, sans-serif" font-size="17">Verified against Program.cs, Endpoints.cs and the frontend route tree.</text>
  <rect x="48" y="132" width="220" height="220" rx="18" fill="#e5f2e8" stroke="#91b79c" stroke-width="2"/>
  <text x="78" y="177" fill="#1d5b35" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Public boundary</text>
  <text x="78" y="225" fill="#17211b" font-family="ui-monospace, monospace" font-size="17">/api/auth/sign-in</text>
  <text x="78" y="255" fill="#17211b" font-family="ui-monospace, monospace" font-size="17">/health/*</text>
  <text x="78" y="300" fill="#526057" font-family="system-ui, sans-serif" font-size="16">Anonymous by design</text>
  <path d="M278 242h78" stroke="#718079" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="366" y="132" width="240" height="220" rx="18" fill="#fff0d5" stroke="#d8ad62" stroke-width="2"/>
  <text x="396" y="177" fill="#805817" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Session boundary</text>
  <text x="396" y="225" fill="#17211b" font-family="ui-monospace, monospace" font-size="17">raccord.session</text>
  <text x="396" y="270" fill="#526057" font-family="system-ui, sans-serif" font-size="16">ASP.NET Identity</text>
  <text x="396" y="300" fill="#526057" font-family="system-ui, sans-serif" font-size="16">Cookie authentication</text>
  <path d="M616 242h78" stroke="#718079" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="702" y="132" width="210" height="220" rx="18" fill="#e8eafa" stroke="#9ba3d5" stroke-width="2"/>
  <text x="732" y="177" fill="#354078" font-family="system-ui, sans-serif" font-size="21" font-weight="700">Protected app</text>
  <text x="732" y="225" fill="#17211b" font-family="ui-monospace, monospace" font-size="17">/api/*</text>
  <text x="732" y="255" fill="#17211b" font-family="ui-monospace, monospace" font-size="17">RequireAuth</text>
  <text x="732" y="300" fill="#526057" font-family="system-ui, sans-serif" font-size="16">Role permissions next</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#718079"/></marker></defs>
</svg>
