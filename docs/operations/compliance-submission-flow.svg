<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Raccord compliance submission flow</title>
  <desc id="desc">Issued invoice creates an immutable pending record. An opt-in worker submits the canonical representation with a record-hash idempotency key and stores accepted, rejected, or pending retry state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#eaf0f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#18324d" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#52708f"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="52" y="54" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#18324d">Compliance submission · evidence flow</text>
  <text x="52" y="82" font-family="Inter,Arial,sans-serif" font-size="15" fill="#52708f">The worker never edits the issued invoice; it advances only the append-only compliance record.</text>

  <g filter="url(#shadow)">
    <rect x="52" y="125" width="235" height="145" rx="16" fill="#ffffff" stroke="#7b9bb8" stroke-width="2"/>
    <rect x="334" y="125" width="235" height="145" rx="16" fill="#ffffff" stroke="#7b9bb8" stroke-width="2"/>
    <rect x="616" y="125" width="235" height="145" rx="16" fill="#ffffff" stroke="#7b9bb8" stroke-width="2"/>
    <rect x="898" y="125" width="250" height="145" rx="16" fill="#ffffff" stroke="#4d9b78" stroke-width="2"/>
  </g>

  <g font-family="Inter,Arial,sans-serif">
    <text x="76" y="161" font-size="17" font-weight="700" fill="#18324d">1 · Issue invoice</text>
    <text x="76" y="191" font-size="14" fill="#35536e">Canonical representation</text>
    <text x="76" y="214" font-size="14" fill="#35536e">+ pending compliance row</text>
    <text x="76" y="246" font-size="13" fill="#52708f">same transaction</text>

    <text x="358" y="161" font-size="17" font-weight="700" fill="#18324d">2 · Claim record</text>
    <text x="358" y="191" font-size="14" fill="#35536e">Record hash = idempotency key</text>
    <text x="358" y="214" font-size="14" fill="#35536e">Certificate loaded from config</text>
    <text x="358" y="246" font-size="13" fill="#52708f">no secret logging</text>

    <text x="640" y="161" font-size="17" font-weight="700" fill="#18324d">3 · Submit</text>
    <text x="640" y="191" font-size="14" fill="#35536e">Authority HTTP adapter</text>
    <text x="640" y="214" font-size="14" fill="#35536e">Canonical invoice payload</text>
    <text x="640" y="246" font-size="13" fill="#52708f">retries stay pending</text>

    <text x="922" y="161" font-size="17" font-weight="700" fill="#236344">4 · Persist result</text>
    <text x="922" y="191" font-size="14" fill="#35536e">accepted / rejected / pending</text>
    <text x="922" y="214" font-size="14" fill="#35536e">reference + safe error</text>
    <text x="922" y="246" font-size="13" fill="#52708f">attempt metadata</text>
  </g>
  <path d="M287 198H324" stroke="#52708f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M569 198H606" stroke="#52708f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M851 198H888" stroke="#52708f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1018 270v38H451v-38" fill="none" stroke="#c1844a" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="562" y="334" font-family="Inter,Arial,sans-serif" font-size="13" fill="#9a602d">transient failure → later retry with the same idempotency key</text>
</svg>
